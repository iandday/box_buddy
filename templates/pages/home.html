{% extends "layout/base.html" %}

{% block content %}
    <div class="flex flex-col items-center pt-4">
        <h2>Top Level Boxes</h2>
        <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 pt-10 px-10">
            {% for x in parents %}
                <div class="card card-xs bg-base-300 hover:shadow-2xl transition-shadow duration-300">
                    <div class="card-body p-4 flex flex-col items-center">
                        <h2 class="card-title text-accent">
                            <a href="{% url "box_detail" x.slug %}" class="link link-primary">{{ x.name }}</a>
                        </h2>
                        <div class="card-actions justify-end">
                            <a role="button"
                               class="btn"
                               href="{% url "box_list" %}{% querystring parent=x.slug %}">
                                <div class="badge badge-sm badge-secondary">
                                    <i class="fa fa-cubes"></i>
                                    {{ x.children.all|length }}
                                </div>
                            </a>
                            <a role="button"
                               class="btn"
                               href="{% url "item_list" %}{% querystring box=x.slug %}">
                                <div class="badge badge-sm badge-secondary">
                                    <i class="fa fa-list"></i>
                                    {{ x.item_count }}
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
