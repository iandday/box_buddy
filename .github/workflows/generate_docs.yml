name: Generate Documentation
description: |
  This workflow generates the documentation using MkDocs and deploys it to GitHub Pages.
on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-${{ env.cache_id }}
            mkdocs-material-
      - name: Publish to GitHub Pages
        run: uv run --all-groups --inexect mkdocs gh-deploy --force
